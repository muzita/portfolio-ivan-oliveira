<!DOCTYPE html>
<html lang="pt-PT">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfólio — Ivan Oliveira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Outfit:wght@300&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --cream: #fffdd0;
      --green: #013630;
      --mint: #c2e6c1;
      --sage: #97b797;
      --teal: #097062;
      --orange: #e05311;
      --grey: #727272;
      --ph: #d9e4d4;
      --tabH: 0px;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --cream: #fffdd0;
        --green: #013630;
        --mint: #c2e6c1;
        --sage: #97b797
      }
    }

    :root[data-theme="dark"] {
      --cream: #fffdd0;
      --green: #013630;
      --mint: #c2e6c1;
      --sage: #97b797
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      background: var(--cream);
      font-family: "Lufga", "Outfit", system-ui, sans-serif;
      font-weight: 300;
      overflow-x: clip
    }

    .serif {
      font-family: "Instrument Serif", Georgia, serif;
      font-style: italic;
      font-weight: 400
    }

    main {
      padding-top: var(--tabH)
    }

    /* pasta */
    .pn {
      position: sticky;
      top: var(--tabH);
      height: calc(100svh - var(--tabH));
      z-index: var(--z)
    }

    .burger {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: max(14px, 2.5vw);
      z-index: 1000;
      width: 52px;
      height: 52px;
      border: 0;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 2px var(--cream);
      cursor: pointer;
      display: grid;
      place-content: center;
      gap: 7px
    }

    .burger i {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--cream);
      transition: transform .3s
    }

    .open .burger i:first-child {
      transform: translateY(4.5px) rotate(45deg)
    }

    .open .burger i:last-child {
      transform: translateY(-4.5px) rotate(-45deg)
    }

    .burger:focus-visible,
    .menu a:focus-visible {
      outline: 3px solid var(--mint);
      outline-offset: 3px
    }

    .menu {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--green);
      color: var(--cream);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: env(safe-area-inset-top, 0px) 8vw 0;
      overflow: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s
    }

    .open .menu {
      opacity: 1;
      visibility: visible
    }

    .menu a {
      font-size: clamp(40px, 7vw, 110px);
      line-height: 1.05;
      color: inherit;
      text-decoration: none;
      display: block;
      width: max-content;
      max-width: 100%
    }

    .menu a:hover {
      color: var(--mint)
    }

    .menu a.s {
      font-size: clamp(20px, 2.4vw, 40px);
      margin-left: 1.2em;
      color: var(--mint)
    }

    .menu a.s:hover {
      color: var(--cream)
    }

    .body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      border-radius: 22px 22px 0 0;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      column-gap: 1.5vw;
      align-items: center;
      padding: 0 4.3vw;
      transform-origin: 50% 0;
      transform: translateY(calc(var(--p, 0) * -4vh)) scale(calc(1 - var(--p, 0) * .05));
      filter: brightness(calc(1 - var(--p, 0) * .3))
    }

    .dark {
      --bg: var(--green);
      --fg: var(--cream);
      --tc: var(--mint)
    }

    .mint {
      --bg: var(--mint);
      --fg: var(--green);
      --tc: var(--green)
    }

    .sage {
      --bg: var(--sage);
      --fg: var(--green);
      --tc: var(--green)
    }

    h1,
    h2 {
      font-size: clamp(40px, 5vw, 96px);
      line-height: 1.05;
      margin-bottom: .3em
    }

    .txt {
      grid-column: 1/6;
      transform: translateY(calc(var(--q, 0) * 22vh))
    }

    .txt p {
      font-size: clamp(14px, 1.15vw, 22px);
      line-height: 1.28;
      margin-bottom: 1em;
      max-width: 32em
    }

    .cover h1 {
      grid-column: 1/-1;
      font-size: clamp(72px, 13vw, 250px);
      text-align: right;
      line-height: .95;
      margin: 0;
      transform: translateY(calc(var(--q, 0) * 30vh))
    }

    .cover .name {
      grid-column: 1/-1;
      text-align: right;
      font-size: clamp(26px, 3.3vw, 64px)
    }

    .cover .body {
      align-content: end;
      padding-bottom: 3.5vw
    }

    .serv {
      grid-column: 9/-1;
      text-align: right;
      font-size: clamp(14px, 1.25vw, 24px);
      line-height: 1.3;
      transform: translateY(calc(var(--q, 0) * 35vh))
    }

    .serv b {
      display: block;
      font-size: clamp(19px, 1.8vw, 34px);
      margin-top: 1em;
      font-weight: 400
    }

    .serv b:first-child {
      margin-top: 0
    }

    .logos {
      grid-column: 7/-1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3.2% 3.4%;
      transform: translateY(calc(var(--q, 0) * 40vh))
    }

    .logos i {
      aspect-ratio: 286/144;
      border-radius: 6px;
      overflow: hidden;
      display: grid;
      place-items: center
    }

    .tiles,
    .phones {
      grid-column: 7/-1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3.2%;
      align-items: start
    }

    .col {
      --sp: 40;
      transform: translateY(calc((var(--q, 0) - var(--p, 0) * .25) * var(--sp) * 1vh))
    }

    .col:nth-child(2) {
      --sp: 75
    }

    .col:nth-child(3) {
      --sp: 110
    }

    .t {
      aspect-ratio: 296.667/371.667;
      border-radius: 10.4%/8.3%;
      background: var(--ph);
      overflow: hidden
    }

    .t+.t {
      margin-top: 7.4%
    }

    .col:nth-child(1) .t:first-child {
      margin-top: 15.8%
    }

    .col:nth-child(3) .t:first-child {
      margin-top: 18.9%
    }

    .phones {
      grid-column: 6/-1;
      gap: 6%
    }

    .ph {
      aspect-ratio: 356/615;
      border-radius: 10.4%/6%;
      background: #2a4a45;
      overflow: hidden
    }

    .ph:nth-child(2) {
      background: #131313
    }

    .ph.col:nth-child(odd) {
      margin-top: 14%
    }

    .m {
      display: inline
    }

    .t img,
    .ph img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .web {
      grid-column: 6/-1;
      display: flex;
      align-items: center
    }

    .w1 {
      --sp: 40;
      flex: 0 0 74%
    }

    .w2 {
      --sp: 90;
      flex: 0 0 25.4%;
      margin-left: -15%;
      z-index: 2
    }

    .web img {
      width: 100%;
      height: auto;
      max-height: 82svh;
      object-fit: contain;
      display: block
    }

    .logos img {
      max-width: 70%;
      max-height: 70%;
      object-fit: contain
    }

    @media (max-width:820px) {
      .burger {
        width: 46px;
        height: 46px
      }

      .menu a.s {
        margin-left: .8em
      }

      .body {
        display: block;
        padding: 11vh 6vw 0
      }

      .txt {
        margin-bottom: 3vh;
        transform: none
      }

      .txt p {
        font-size: clamp(12px, 1.9svh, 14px);
        line-height: 1.25;
        margin-bottom: .7em
      }

      h2 {
        font-size: clamp(30px, 5svh, 38px)
      }

      .cover .body {
        display: grid;
        align-content: end;
        padding: 0 6vw 6vh
      }

      .col {
        --sp: 18 !important
      }

      .serv {
        margin-top: 2vh;
        transform: none;
        text-align: left;
        font-size: clamp(11px, 1.7svh, 13px)
      }

      .serv b {
        margin-top: .6em;
        font-size: 18px
      }

      .tiles {
        gap: 2.5%
      }

      .t+.t {
        margin-top: 5%
      }

      .phones .ph {
        margin-top: 0 !important
      }

      .logos,
      .tiles,
      .phones {
        transform: none
      }
    }

    @media (prefers-reduced-motion:reduce) {
      .pn * {
        transform: none !important
      }

      .body {
        filter: none !important
      }
    }
  </style>
</head>

    (function () {
